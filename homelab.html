
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0" />
  <title>Homelab | Lewis Barrett</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="js/main.js" defer></script>
</head>

<body>

<header class="site-header">
  <div id="header-placeholder"></div>
</header>

<main class="container">

  <section class="page-header">
    <h1>Homelab</h1>
    <p>
      A collection of my home infrastructure
      projects, experiments and technical learning.
    </p>
  </section>

  <section class="video-panel">
    <div class="video-panel-top">

      <div class="sort-bar">

        <label for="homelab-category">Category</label>
        <select id="homelab-category"></select>

        <label for="homelab-sort">Sort</label>
        <select id="homelab-sort">
          <option value="latest">Latest first</option>
          <option value="oldest">Oldest first</option>
        </select>

        <input
          id="homelab-search"
          class="tutorial-search"
          type="search"
          placeholder="Search homelab..."
        />

      </div>
    </div>

    <section id="homelab-list" class="grid">
      <p>Loading homelab projects...</p>
    </section>

  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
<script src="js/homelab-loader.js"></script>

</body>
</html>
